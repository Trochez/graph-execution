name: Pax autonomous qualification
on:
  push:
    branches: [feat/pax-durable-multicli]
    paths: ['src/**', 'tests/qualification/**', 'scripts/create_pax_fixture.py', 'pyproject.toml', '.github/workflows/pax-autonomous.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[pax]'
      - run: python -m compileall -q src scripts tests
      - run: gexec --help
      - run: python -m unittest discover -s tests/qualification -p 'test_*.py' -v
      - name: Actual Docker broker and Git export
        shell: bash
        run: |
          docker pull python:3.12-slim
          IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          python scripts/create_pax_fixture.py --output "$RUNNER_TEMP/gexec-fixture" --image "$IMAGE" --base-url http://localhost:20128/v1 --model openai:fixture
          python tests/qualification/docker_smoke.py --image "$IMAGE" --wheelhouse "$RUNNER_TEMP/gexec-fixture/wheels"
