name: Pax durable runtime integration
on:
  push:
    branches:
      - feat/pax-durable-multicli
    paths:
      - 'src/**'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - '.github/workflows/pax-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[pax]'
      - run: python -m pip check
      - run: python -m graph_execution_runtime.cli --help
      - run: python -m compileall -q src
      - run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - run: python tests/integration/temporal_runtime_smoke.py
      - run: python tests/integration/pipeline_smoke.py
      - run: python tests/integration/controller_smoke.py
