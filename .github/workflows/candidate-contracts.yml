name: Candidate runtime contracts
on:
  push:
    branches:
      - feat/pax-durable-multicli
    paths:
      - 'src/**'
      - 'tests/contracts/**'
      - 'pyproject.toml'
      - '.github/workflows/candidate-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - run: python -c "from graph_execution_runtime.contracts import GraphInput; from graph_execution_runtime.messaging import Envelope; assert GraphInput.model_json_schema() and Envelope.model_json_schema()"
